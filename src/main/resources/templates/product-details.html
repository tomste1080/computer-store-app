<!DOCTYPE html>
<html lang="en"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Szczegóły produktu</title>
</head>
<body>
    <div layout:fragment="content" class="container">
        <div class="row d-flex">
            <div class="mt-3">
                <p><a class="link-opacity-100" th:href="@{/kategoria/{slug}(slug=${category.slug})}" th:text="${category.name}"></a></p>
            </div>
            <div class="col-md-6">
                <img class="img-fluid w-70 rounded" th:src="${product.imageUrl}">
            </div>
            <div class="col-md-4">
                <h4 th:text="${product.name}">Komputer</h4>
                <h6 th:text="|Producent: ${product.producer}|">Producent</h6>
                <h6 th:text="|Cena: ${product.price} zł|">Cena</h6>
                <h6 th:text="|Ilość sztuk: ${product.quantity}|"></h6>
                <h6 th:if="${product.active}">Dostępny</h6>
                <h6 th:unless="${product.active}">Niedostępny</h6>
                <div>
                    <form th:action="@{/koszyk}" method="post">
                        <input type="hidden" name="productId" th:value="${product.id}">
                        <button type="submit" class="btn btn-primary">Dodaj do koszyka</button>
                    </form>
                </div>
            </div>
            <div class="col-md-12">
                <h3>Pełny opis produktu: </h3>
                <h5 class="mt-3" th:text="${product.description}"></h5>
            </div>
        </div>
    </div>
</body>
</html>
