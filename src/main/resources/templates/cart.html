<!DOCTYPE html>
<html lang="en"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Koszyk</title>
</head>
<body>
    <div layout:fragment="content" class="container">
        <div class="row">
            <div class="col-md-8">
                <table class="table border">
                    <thead>
                    <tr>
                        <th scope="col" style="width: 50%;">Produkt</th>
                        <th scope="col">Cena</th>
                        <th scope="col">Ilość</th>
                        <th scope="col">Suma</th>
                    </tr>
                    </thead>
                    <tbody th:each="item, idx : ${cartProducts}">
                    <tr>
                        <td>
                            <div class="d-flex align-items-start gap-3">
                                <img th:src="${item.product.imageUrl}" width="100" height="100">
                                <span th:text="${item.product.name}">Nazwa produktu</span>
                            </div>
                        </td>
                        <td th:text="|${item.product.price} zł|">Price</td>
                        <td th:text="|${item.product.quantity} sztk|">Ilość</td>
                        <td th:text="|${productPrice} zł|">Suma</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <div class="col-md-4 g-0">
                <div class="card">
                    <div class="card-body d-flex">
                        <p>Wartość produktów wraz z dostawą: </p>
                        <p class="ms-3" th:text="|${totalPrice} zł|"></p>
                    </div>
                    <div class="ms-3 d-flex">
                        <p>Koszt dostawy:</p>
                        <p class="ms-3">15zł</p>
                    </div>
                    <div class="text-center">
                        <a class="btn btn-primary" th:href="@{/koszyk/kasa}">Przejdź do kasy</a>
                    </div>
                    <div class="text-center mt-3">
                        <label class="form-check-label" for="checkDefault">
                            Masz kod rabatowy?
                        </label>
                        <input class="form-check-input" type="checkbox" value="" id="checkDefault">
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
