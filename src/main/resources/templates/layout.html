<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">Sklep komputerowy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<div class="container">
    <div class="row">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand mx-3" th:href="@{/}">TechStore</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <form class="d-flex mx-auto col-12 col-lg-7 my-2 my-lg-0 align-items-center" role="search">
                        <label class="form-check-label text-nowrap d-flex me-3">Czego szukasz?</label>
                        <input class="form-control me-2" name="search" type="search" placeholder="procesory, karty graficzne, dyski, klawiatury, myszki, drukarki, ..." aria-label="Search"/>
                        <button class="btn btn-primary" type="submit">Search</button>
                    </form>
                    <ul class="navbar-nav mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" th:href="@{/koszyk}">Koszyk</a>
                        </li>
                        <li>
                            <a class="nav-link active" th:href="@{/kontakt}">Kontakt</a>
                        </li>
                        <li class="nav-item">
                            <a sec:authorize="!isAuthenticated()" class="nav-link active" th:href="@{/login}">Zaloguj się</a>
                            <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" class="d-inline">
                                <button type="submit" class="nav-link active text-danger btn btn-link">Wyloguj się</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>
</div>
<div class="container">
    <div class="row">
        <div class="col-12 banner text-center text-white">
            <h4>Kup swój wymarzony sprzęt</h4>
        </div>
        <div class="row">
            <div class="d-flex justify-content-center align-items-center mt-3">
                <a th:each="category : ${categories}" th:href="@{/kategoria/{slug}(slug=${category.slug})}" th:text="${category.name}"
                   class="btn btn-outline-primary btn-sm px-3 rounded-pill text-nowrap flex-fill">Laptopy i komputery</a>
            </div>
        </div>
    </div>
</div>

<main layout:fragment="content" class="container text-center">
</main>

<footer class="text-center py-4 bg-body-tertiary">
    <div class="container">
        <p class="mb-0">&copy; 2026 TechStore. Wszelkie prawa zastrzeżone.</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
